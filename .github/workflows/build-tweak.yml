name: Build Tweak

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Install Dependencies
      run: |
        # เพิ่ม dpkg เพื่อให้สามารถแพ็กไฟล์ .deb ได้
        brew install ldid xz gettext dpkg
        mkdir -p ~/theos/sdks
        # เปลี่ยนเป็น 14.5.sdk.tar.xz เพื่อให้แตกไฟล์ด้วย -xJ ได้อย่างถูกต้อง
        curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS14.5.sdk.tar.xz | tar -xJ -C ~/theos/sdks/

    - name: Build Tweak
      run: |
        export THEOS=~/theos
        cd $GITHUB_WORKSPACE
        echo "Testing Make..."
        which make
        make --version
        echo "Building..."
        make package FINALPACKAGE=1 || (make clean && make package FINALPACKAGE=1)

    - name: Check Output
      if: always()
      run: |
        echo "=== Workspace structure ==="
        find . -maxdepth 3 -type d | head -20
        echo "=== Looking for build artifacts ==="
        find . -name "*.deb" -o -name "*.ipa" -o -name "*.dylib" 2>/dev/null | head -20
        echo "=== Packages directory ==="
        ls -laR packages/ 2>/dev/null || echo "No packages directory"

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          packages/
          debs/
          *.deb
          *.ipa
        retention-days: 7
