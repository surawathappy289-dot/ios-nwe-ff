name: Build Tweak

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Install Dependencies
      run: |
        # เพิ่ม dpkg เพื่อให้สามารถแพ็กไฟล์ .deb ได้
        brew install ldid xz gettext dpkg
        mkdir -p ~/theos/sdks
        # เปลี่ยนเป็น 14.5.sdk.tar.xz เพื่อให้แตกไฟล์ด้วย -xJ ได้อย่างถูกต้อง
        curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS14.5.sdk.tar.xz | tar -xJ -C ~/theos/sdks/

    - name: Build Tweak
      run: |
        export THEOS=~/theos
        cd $GITHUB_WORKSPACE
        echo "Testing Make..."
        which make
        make --version
        echo "Building..."
        make package FINALPACKAGE=1 || (make clean && make package FINALPACKAGE=1)

    - name: Build iPad Tweak
      run: |
        export THEOS=~/theos
        cd $GITHUB_WORKSPACE/ipad
        echo "Building iPad version..."
        make package FINALPACKAGE=1 || (make clean && make package FINALPACKAGE=1)

    - name: Build iPad IPA
      if: always()
      run: |
        IPAD_DEB=$(find $GITHUB_WORKSPACE/ipad -name "*.deb" -type f | head -1)
        if [ -n "$IPAD_DEB" ]; then
          echo "Found iPad DEB: $IPAD_DEB"
          chmod +x $GITHUB_WORKSPACE/scripts/deb-to-ipa.sh
          APP_NAME=ffzipad BUNDLE_ID=com.zexis.so.ipad APP_TITLE="IMGuiMod (iPad)" \
            DEVICE_FAMILY="2" OUTPUT_IPA=ffzipad-ipad.ipa \
            bash $GITHUB_WORKSPACE/scripts/deb-to-ipa.sh "$IPAD_DEB" "$GITHUB_WORKSPACE"
        else
          echo "No iPad DEB found, skipping IPA"
        fi

    - name: Check Output
      if: always()
      run: |
        echo "=== Workspace structure ==="
        find . -maxdepth 3 -type d | head -20
        echo "=== Looking for build artifacts ==="
        find . -name "*.deb" -o -name "*.ipa" -o -name "*.dylib" 2>/dev/null | head -20
        echo "=== Packages directory ==="
        ls -laR packages/ 2>/dev/null || echo "No packages directory"

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          packages/
          ipad/packages/
          debs/
          *.deb
          *.ipa
          **/*.deb
          **/*.ipa
          **/*.dylib
        retention-days: 7
         
